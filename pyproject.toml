[project]
name = "abendausgabe"
version = "0.1.0"
description = "Privater Sender für den eigenen Haushalt: endliche, interaktive Abendsendung am Smart-TV"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pyyaml>=6.0",
  "segno>=1.6",
  "httpx>=0.27",
]

[project.scripts]
abend = "abendausgabe.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abendausgabe"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["abendausgabe.core.*", "abendausgabe.session.*"]
strict = true

[[tool.mypy.overrides]]
module = ["segno", "segno.*"]
ignore_missing_imports = true
