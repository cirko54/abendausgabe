<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Abendausgabe – TV-Testberichte</title>
  <link rel="stylesheet" href="/shared/base.css">
  <style>
    body { padding: 24px; font-size: 17px; line-height: 1.45; max-width: 900px; margin: 0 auto; }
    h1 { font-size: 28px; }
    article { border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin: 0 0 16px; background: var(--surface); }
    .code { font-size: 22px; font-weight: 700; }
    .muted { color: var(--muted); }
    pre { white-space: pre-wrap; word-break: break-word; font-size: 13px; color: var(--muted); }
    a { color: var(--text); }
  </style>
</head>
<body>
  <h1>TV-Testberichte</h1>
  <p class="muted">Den Test startest du am Fernseher unter /tv/check.html.</p>
  <div id="list"></div>
  <script>
    (async function () {
      const list = document.getElementById("list");
      function esc(v) {
        return String(v == null ? "" : v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }
      const response = await fetch("/api/tv-check", { credentials: "same-origin" });
      if (response.status === 401) {
        list.innerHTML = '<p>Erst <a href="/c/">am Handy anmelden</a>, dann diese Seite erneut öffnen.</p>';
        return;
      }
      if (response.status === 403) {
        list.innerHTML = "<p>Diese Seite ist nur für Admins.</p>";
        return;
      }
      const data = await response.json();
      if (!data.reports.length) {
        list.innerHTML = "<p>Noch kein Bericht. Test am Fernseher starten.</p>";
        return;
      }
      list.innerHTML = data.reports.map(function (r) {
        const notes = (r.verdict.notes || []).map(function (n) { return "<li>" + esc(n) + "</li>"; }).join("");
        return "<article><p class=\"code\">" + esc(r.verdict.code) + ": " + esc(r.verdict.label) + "</p>" +
          "<p class=\"muted\">" + esc(new Date(r.created_at).toLocaleString("de-DE")) + "</p>" +
          "<p class=\"muted\">" + esc(r.user_agent) + "</p>" +
          (notes ? "<ul>" + notes + "</ul>" : "") +
          "<details><summary>Rohdaten</summary><pre>" + esc(JSON.stringify(r.report, null, 2)) + "</pre></details></article>";
      }).join("");
    })();
  </script>
</body>
</html>
